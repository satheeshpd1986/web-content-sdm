<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body{
            justify-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            text-align: center;
        }

        .container{
            background-color: rgb(226, 221, 216);
            padding: 20px 30px;
            width: fit-content;
            border-radius: 10px;
        }

        .l1{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: larger;
        }

        .c1{
            font-family: 'Lucida Sans', Geneva, Verdana, sans-serif;
            font-size: large;
            width: 500px;
            height: 35px;
            margin: 10px 0 15px 0;
            padding-left: 10px;
            box-shadow: 5px 5px 10px gray;
            border-radius: 5px;
            border: none;
            
        }

        .btn-container{
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .b{
            background-color: chartreuse;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .b:hover{
            background-color: green;
        }
    </style>
</head>

<body>

    <h1>Registration Form</h1>

    <div class="container">

        <form>

            <label class="l1">Name:</label><br>
            <input type="text" class="c1" placeholder="Enter your name"><br>

            <label class="l1">Password:</label><br>
            <input type="password" class="c1" placeholder="Enter your password"><br>

            <div class="btn-container">
                <input type="submit" class="b" value="Submit">
                <input type="reset" class="b" value="Reset">
            </div>

        </form>

    </div>

</body>
</html>
